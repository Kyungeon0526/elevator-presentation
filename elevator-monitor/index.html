<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기숙사 엘리베이터 모니터링</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 부경대학교 기숙사</h1>
            <p class="subtitle">엘리베이터 실시간 모니터링</p>
        </header>

        <main>
            <div class="content-wrapper">
                <!-- 왼쪽: 엘리베이터 샤프트 -->
                <div class="elevator-shaft-container">
                    <div class="status-bar vertical">
                        <div class="status-item">
                            <span class="label">현재 층</span>
                            <span class="value" id="current-floor">1F</span>
                        </div>
                        <div class="status-item">
                            <span class="label">방향</span>
                            <span class="value" id="direction">-</span>
                        </div>
                        <div class="status-item">
                            <span class="label">상태</span>
                            <span class="value" id="status">연결 대기 중</span>
                        </div>
                    </div>

                    <div class="elevator-shaft">
                        <!-- 층수는 JavaScript로 동적 생성 (16F ~ 1F) -->
                        <div id="floors-container"></div>
                    </div>

                    <div class="last-update">
                        <span id="last-update">마지막 업데이트: --:--:--</span>
                    </div>
                </div>

                <!-- 오른쪽: 대시보드 -->
                <div class="dashboard-container">
                    <!-- 오늘 이용량 대시보드 -->
                    <div class="dashboard">
                        <h2>📊 오늘 엘리베이터 이용량</h2>

                        <div class="dashboard-stats">
                            <div class="stat-card">
                                <div class="stat-icon">🚪</div>
                                <div class="stat-content">
                                    <div class="stat-label">총 정차 횟수</div>
                                    <div class="stat-value" id="total-stops">0회</div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div class="stat-icon">📈</div>
                                <div class="stat-content">
                                    <div class="stat-label">총 이용 횟수</div>
                                    <div class="stat-value" id="total-usage">0회</div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div class="stat-icon">⏰</div>
                                <div class="stat-content">
                                    <div class="stat-label">마지막 정차</div>
                                    <div class="stat-value" id="last-stop">--:--</div>
                                </div>
                            </div>
                        </div>

                        <!-- 시간대별 이용량 -->
                        <div class="usage-chart">
                            <h3>시간대별 이용량</h3>
                            <div id="hourly-usage">
                                <!-- JavaScript로 동적 생성 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>ESP32 연동 대기 중 | 데이터 수신 준비 완료</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
